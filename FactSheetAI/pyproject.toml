[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factsheetai"
version = "0.1.0"
description = "Provenance-first mutual fund portfolio overlap and drift engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pandas>=2.1", "fastapi>=0.110", "uvicorn>=0.27", "xlrd>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "hypothesis>=6", "openpyxl>=3.1", "pandas-stubs>=2.1", "build>=1.2", "httpx2>=2.0"]

[project.scripts]
factsheetai = "factsheetai.__main__:main"

[tool.setuptools.packages.find]
include = ["factsheetai*"]

[tool.setuptools.package-data]
factsheetai = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
disable_error_code = ["import-untyped"]


